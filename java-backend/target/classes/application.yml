server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: financial-report-backend
  
  # Web配置
  web:
    cors:
      allowed-origins: 
        - "http://localhost:5173"
        - "http://127.0.0.1:5173"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true

# Python FastAPI 服务配置
python-service:
  base-url: http://localhost:8000
  timeout: 30000  # 30秒超时

# 日志配置
logging:
  level:
    com.tonghuashun: INFO
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Swagger 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha